name: Reproduce archived results
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-reproduce.txt
      - run: python -m pip install -r requirements-reproduce.txt pytest==9.1.1
      - run: python -m pytest -q tests paper/analysis
      - run: python scripts/reproduce.py
      - uses: actions/upload-artifact@v4
        with:
          name: reproduced-tables-and-figures
          path: build/reproduced/
