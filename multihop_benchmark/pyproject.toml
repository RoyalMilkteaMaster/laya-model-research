[project]
name = "multihop-benchmark"
version = "0.1.0"
description = "Laya 作為多跳問答 Agent 決策層之對比實驗"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.0",
    "datasets>=3.0",
    "pynvml>=12.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "ollama>=0.6.3",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "laya>=0.3.21",
]

[project.scripts]
multihop-benchmark = "multihop_benchmark.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multihop_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: 需要 Ollama＋GPU 的煙霧測試（以 `pytest -m integration` 執行）",
]
